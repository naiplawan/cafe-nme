<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบ POS ร้านกาแฟ พร้อมบัตรสะสมแต้ม LINE · Cafe'nMe</title>
<meta name="description" content="Cafe'nMe ระบบขายหน้าร้านสำหรับร้านกาแฟไทย ขายบนแท็บเล็ต รับเงินสดและพร้อมเพย์ QR ลูกค้าสะสมแต้มผ่าน LINE OA ของร้าน เจ้าของดูยอดขายและรายงานได้จากเว็บ">
<link rel="canonical" href="https://cafenme.example/">
<meta property="og:type" content="website">
<meta property="og:locale" content="th_TH">
<meta property="og:site_name" content="Cafe'nMe">
<meta property="og:title" content="ระบบ POS ร้านกาแฟ พร้อมบัตรสะสมแต้ม LINE · Cafe'nMe">
<meta property="og:description" content="ขายบนแท็บเล็ต รับพร้อมเพย์ QR สะสมแต้มผ่าน LINE ดูรายงานยอดขายได้จากทุกที่">
<meta property="og:image" content="https://cafenme.example/opengraph-image">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../../../frontend/public/assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Kanit:wght@500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@500;600;700&display=swap" rel="stylesheet">
<script type="application/ld+json" id="ld"></script>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:1140px;margin:0 auto;padding:0 16px}
section{padding:80px 0}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- prototype toolbar (not part of the page) ---------- */
.proto{position:sticky;top:0;z-index:100;background:#111;color:#eee;font:500 13px/1.4 system-ui,sans-serif;display:flex;gap:8px;align-items:center;padding:8px 12px;overflow-x:auto;white-space:nowrap}
.proto b{color:#fff;margin-right:4px}
.proto button{font:inherit;border:1px solid #444;background:#222;color:#ddd;border-radius:999px;padding:6px 12px;cursor:pointer}
.proto button[aria-pressed=true]{background:#fff;color:#111;border-color:#fff}
.proto .sep{width:1px;height:20px;background:#444;margin:0 4px;flex:none}
.proto .desc{color:#aaa;margin-left:6px}
dialog{max-width:min(860px,94vw);width:100%;border:0;border-radius:12px;padding:0;font:13px/1.5 ui-monospace,monospace}
dialog header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#111;color:#fff;font-family:system-ui}
dialog pre{margin:0;padding:16px;max-height:70vh;overflow:auto;background:#fafafa}
dialog button{font:inherit;background:#333;color:#fff;border:0;border-radius:6px;padding:4px 10px;cursor:pointer}

/* notes overlay */
body.notes [data-note]{outline:2px dashed #7c3aed;outline-offset:4px;position:relative}
body.notes .cell,body.notes .card{overflow:visible}
body.notes [data-note]::after{content:attr(data-note);position:absolute;top:-14px;left:6px;z-index:50;background:#7c3aed;color:#fff;font:600 11px/1.7 system-ui,sans-serif;padding:0 7px;border-radius:4px;white-space:nowrap;pointer-events:none}

/* ---------- shared component skeletons ---------- */
.nav{display:flex;align-items:center;gap:20px;height:68px}
.nav .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;text-decoration:none}
.nav .logo img{width:34px;height:34px;border-radius:9px}
.nav .links{display:flex;gap:22px;margin-left:auto;font-size:15px}
.nav .links a{text-decoration:none;opacity:.8}
.nav .links a:hover{opacity:1}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:12px;font-weight:600;font-size:16px;text-decoration:none;border:1.5px solid transparent;cursor:pointer}
.btn-sm{min-height:40px;padding:0 16px;font-size:14px}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.tablet{border-radius:24px;padding:11px;background:#1E1A17;box-shadow:0 30px 60px -20px rgba(30,26,23,.45)}
.tablet img{border-radius:13px;width:100%}
.phone{width:210px;border-radius:34px;padding:8px;background:#141110;box-shadow:0 24px 50px -18px rgba(0,0,0,.5)}
.phone img{border-radius:26px;width:100%}
.shot{border-radius:14px;overflow:hidden;border:1px solid rgba(0,0,0,.08)}
.shot img{width:100%}
.faq details{border-bottom:1px solid var(--line);padding:18px 0}
.faq summary{cursor:pointer;font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:22px;line-height:1;color:var(--accent);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{margin-top:10px;color:var(--muted);line-height:1.75}
.cmp{width:100%;border-collapse:collapse;font-size:15px}
.cmp caption{text-align:left;color:var(--muted);font-size:13px;padding-bottom:10px}
.cmp th,.cmp td{padding:14px 12px;border-bottom:1px solid var(--line);text-align:center}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp thead th{font-size:14px}
.cmp .hl{background:var(--hl)}
.v-yes{color:var(--yes);font-weight:700}.v-no{opacity:.45}.v-some{color:var(--muted);font-size:13px}
.tablewrap{overflow-x:auto}
.price-ph{border:2px dashed var(--line);border-radius:18px;padding:36px 20px;text-align:center;color:var(--muted)}
.price-ph strong{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.updated{font-size:13px;color:var(--muted)}
.eyebrow{font-size:14px;font-weight:600;letter-spacing:.02em;color:var(--accent)}
.h2{font-size:clamp(26px,3.4vw,38px);line-height:1.25;font-weight:700}
.lead{font-size:18px;line-height:1.75;color:var(--muted)}
ul.ticks{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
ul.ticks li{padding-left:26px;position:relative;line-height:1.6}
ul.ticks li::before{content:"";position:absolute;left:2px;top:.55em;width:12px;height:7px;border-left:2.5px solid var(--accent);border-bottom:2.5px solid var(--accent);transform:rotate(-45deg)}

@media (max-width:860px){
  section{padding:56px 0}
  .nav .links{display:none}
  .nav .btn-ghost-hide{display:none}
  .g2,.g3,.bento,.hero-grid,.split{grid-template-columns:1fr !important}
  .bento>*{grid-column:auto !important;grid-row:auto !important}
}

/* ================= OPTION A — Warm Café ================= */
.A{--bg:#FBF6EF;--ink:#1E1A17;--muted:#6B5E55;--accent:#B4441C;--line:#EADFD3;--card:#fff;--hl:#F6E7DC;--yes:#2F7D4A;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",sans-serif}
.A h1,.A .h2,.A h3{font-family:"Noto Serif Thai",serif}
.A .btn-p{background:var(--accent);color:#fff}
.A .btn-o{border-color:var(--ink);color:var(--ink)}
.A .hero{padding:48px 0 90px}
.A .hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}
.A h1{font-size:clamp(34px,4.8vw,56px);line-height:1.2;font-weight:700;margin:14px 0 20px}
.A .facts{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:28px;font-size:14px;color:var(--muted)}
.A .facts span::before{content:"●";color:var(--accent);font-size:8px;margin-right:8px;vertical-align:middle}
.A .stage{position:relative;padding:0 0 40px 0}
.A .stage .phone{position:absolute;right:-12px;bottom:-10px;width:150px}
.A .stage .cup{position:absolute;width:110px;left:-30px;top:-30px;transform:rotate(-8deg);filter:drop-shadow(0 12px 18px rgba(0,0,0,.18))}
.A .def{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.A .def .wrap{max-width:860px;text-align:center}
.A .def p.big{font-family:"Noto Serif Thai",serif;font-size:clamp(20px,2.4vw,27px);line-height:1.75;margin-top:18px}
.A .feat{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding:44px 0}
.A .feat:nth-child(even) .feat-img{order:2}
.A .feat h3{font-size:28px;margin:8px 0 12px}
.A .feat p{line-height:1.8;color:var(--muted)}
.A .mini{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
.A .mini>div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px}
.A .mini h3{font-size:21px;margin-bottom:8px}
.A .mini p{color:var(--muted);line-height:1.75}
.A .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px;counter-reset:s}
.A .steps li{list-style:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px}
.A .steps li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;margin-bottom:16px}
.A .steps h3{font-size:20px;margin-bottom:6px}
.A .steps p{color:var(--muted);line-height:1.7}
.A .cta{background:var(--accent);color:#fff;border-radius:28px;padding:56px 32px;text-align:center}
.A .cta .lead{color:#FBE3D6}
.A .cta .btn{background:#fff;color:var(--accent)}
.A footer{padding:40px 0;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}

/* ================= OPTION B — Clean SaaS ================= */
.B{--bg:#fff;--ink:#0F172A;--muted:#5B6476;--accent:#B4441C;--line:#E5E7EB;--soft:#F7F7F8;--hl:#FFF4EE;--yes:#15803D;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",sans-serif}
.B header{border-bottom:1px solid var(--line)}
.B .btn-p{background:var(--ink);color:#fff}
.B .btn-o{border-color:var(--line);color:var(--ink)}
.B .hero{text-align:center;padding:72px 0 0;background:linear-gradient(#fff,#FFF7F2)}
.B .pill{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--muted)}
.B .pill i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.B h1{font-size:clamp(34px,5.4vw,62px);line-height:1.15;font-weight:700;letter-spacing:-.01em;max-width:900px;margin:22px auto 20px}
.B h1 em{font-style:normal;color:var(--accent)}
.B .hero .lead{max-width:680px;margin:0 auto 30px}
.B .hero .ctas{justify-content:center}
.B .hero .tablet{max-width:980px;margin:56px auto 0;border-radius:24px 24px 0 0;padding-bottom:0;box-shadow:0 -10px 60px -20px rgba(180,68,28,.35)}
.B .hero .tablet img{border-radius:13px 13px 0 0}
.B .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:28px 0;border-bottom:1px solid var(--line)}
.B .chips span{font-size:14px;color:var(--muted);background:var(--soft);border-radius:8px;padding:6px 12px}
.B .center{text-align:center;max-width:760px;margin:0 auto}
.B .center .lead{margin-top:14px}
.B .bento{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;margin-top:44px}
.B .cell{background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:26px;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.B .cell h3{font-size:20px}
.B .cell p{color:var(--muted);line-height:1.7;font-size:15px}
.B .cell .shot{margin-top:auto}
.B .c1{grid-column:span 4;grid-row:span 2}.B .c2{grid-column:span 2}.B .c3{grid-column:span 2}.B .c4,.B .c5,.B .c6{grid-column:span 2}
.B .split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.B .tl{list-style:none;padding:0;margin:28px 0 0;border-left:2px solid var(--line)}
.B .tl li{position:relative;padding:0 0 28px 28px}
.B .tl li::before{content:"";position:absolute;left:-8px;top:4px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.B .tl h3{font-size:18px;margin-bottom:4px}
.B .tl p{color:var(--muted);line-height:1.7}
.B .grey{background:var(--soft)}
.B .faq{max-width:760px;margin:36px auto 0}
.B .cta{text-align:center;background:var(--ink);color:#fff;border-radius:24px;padding:60px 24px}
.B .cta .lead{color:#B6BDCB;margin:12px auto 28px;max-width:560px}
.B .cta .btn-p{background:#fff;color:var(--ink)}
.B .cta .ctas{justify-content:center}
.B footer{padding:36px 0;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}

/* ================= OPTION C — Loyalty first ================= */
.C{--bg:#fff;--ink:#14231A;--muted:#55665B;--accent:#B4441C;--line:#E2ECE5;--green:#06C755;--mint:#EEF9F2;--hl:#EEF9F2;--yes:#06A246;background:var(--bg);color:var(--ink);font-family:"Anuphan",sans-serif}
.C .btn-p{background:var(--accent);color:#fff}
.C .btn-line{background:var(--green);color:#fff}
.C .btn-o{border-color:var(--ink);color:var(--ink)}
.C .hero{background:radial-gradient(1200px 500px at 80% 10%,#DDF6E6,transparent),var(--mint);padding:56px 0 80px}
.C .hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.C .tag{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#067A36;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.C .tag b{background:var(--green);color:#fff;border-radius:6px;padding:0 6px;font-size:12px}
.C h1{font-size:clamp(32px,4.6vw,54px);line-height:1.2;font-weight:700;margin:18px 0}
.C .hero-art{position:relative;display:flex;justify-content:center;min-height:440px}
.C .hero-art .phone{width:230px;transform:rotate(3deg)}
.C .stampcard{position:absolute;left:0;bottom:30px;background:#fff;border-radius:18px;padding:16px;box-shadow:0 20px 40px -18px rgba(0,0,0,.3);width:230px}
.C .stampcard small{color:var(--muted)}
.C .stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.C .stamps img{width:100%;aspect-ratio:1;object-fit:contain}
.C .reward{position:absolute;right:0;top:20px;width:120px;filter:drop-shadow(0 14px 18px rgba(0,0,0,.2))}
.C .g2{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:36px}
.C .side{border:1px solid var(--line);border-radius:22px;padding:30px}
.C .side h3{font-size:22px;margin-bottom:6px}
.C .side.cust{background:var(--mint)}
.C .flow{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px;counter-reset:f}
.C .flow li{list-style:none;text-align:center;padding:0 6px}
.C .flow .ic{width:100px;height:100px;margin:0 auto 14px;border-radius:28px;background:var(--mint);display:grid;place-items:center;position:relative}
.C .flow .ic img{width:66px}
.C .flow .ic::after{counter-increment:f;content:counter(f);position:absolute;top:-8px;right:-8px;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
.C .flow h3{font-size:18px;margin-bottom:6px}
.C .flow p{color:var(--muted);line-height:1.65;font-size:15px}
.C .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px}
.C .card{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}
.C .card .shot{border:0;border-radius:0;border-bottom:1px solid var(--line)}
.C .card div.t{padding:20px}
.C .card h3{font-size:19px;margin-bottom:6px}
.C .card p{color:var(--muted);line-height:1.7;font-size:15px}
.C .alt{background:var(--mint)}
.C .cta{background:#0B3B1F;color:#fff;border-radius:28px;padding:56px 28px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.C .cta .lead{color:#B9D9C5}
.C footer{padding:36px 0;font-size:14px;color:var(--muted);border-top:1px solid var(--line)}

/* ================= OPTION D — Espresso Dark ================= */
.D{--bg:#15100D;--ink:#F4EBDD;--muted:#B5A595;--accent:#E8794A;--line:#33281F;--surface:#1F1813;--hl:#2A1D15;--yes:#7DD39A;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",sans-serif}
.D h1,.D .h2,.D h3,.D .big-num{font-family:"Kanit",sans-serif}
.D .btn-p{background:var(--accent);color:#1A0F09}
.D .btn-o{border-color:#5A4A3D;color:var(--ink)}
.D .hero{padding:64px 0 40px;overflow:hidden}
.D h1{font-size:clamp(40px,7vw,92px);line-height:1.05;font-weight:700;letter-spacing:-.01em;max-width:1000px}
.D h1 span{color:var(--accent)}
.D .hero .row{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-top:28px}
.D .hero .lead{max-width:540px}
.D .fan{position:relative;margin-top:60px;height:clamp(240px,42vw,480px)}
.D .fan .tablet{position:absolute;width:62%;left:4%;top:0;transform:rotate(-3deg);background:#000}
.D .fan .shot{position:absolute;width:46%;right:2%;top:16%;transform:rotate(4deg);border-color:#3a2e26;box-shadow:0 30px 60px -20px #000}
.D .fan .phone{position:absolute;width:clamp(110px,16%,180px);left:50%;top:22%;transform:translateX(-50%)}
.D .marq{border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;padding:16px 0;font-family:"Kanit";font-size:20px;color:var(--muted)}
.D .marq div{display:inline-block;animation:mq 40s linear infinite}
.D .marq span{margin:0 22px}.D .marq span::before{content:"✦";color:var(--accent);margin-right:22px}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.D .marq div{animation:none}}
.D .def p.big{font-size:clamp(20px,2.6vw,30px);line-height:1.6;max-width:900px;margin-top:16px}
.D .bento{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}
.D .cell{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.D .cell h3{font-size:22px;font-weight:600}
.D .cell p{color:var(--muted);line-height:1.7;font-size:15px}
.D .cell .shot{margin-top:auto;border-color:#3a2e26}
.D .w2{grid-column:span 2}
.D .numsteps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:36px;padding:0}
.D .numsteps li{list-style:none;border-top:2px solid var(--accent);padding-top:18px}
.D .big-num{font-size:64px;font-weight:800;color:var(--accent);line-height:1}
.D .numsteps h3{font-size:22px;margin:10px 0 6px}
.D .numsteps p{color:var(--muted);line-height:1.7}
.D .cmp th,.D .cmp td{border-color:var(--line)}
.D .price-ph strong{color:var(--ink)}
.D .cta{background:linear-gradient(135deg,#E8794A,#B4441C);color:#1A0F09;border-radius:28px;padding:64px 28px;text-align:center}
.D .cta .h2{font-size:clamp(30px,5vw,56px)}
.D .cta .lead{color:#3A1A0C;margin:12px auto 28px;max-width:560px}
.D .cta .btn{background:#15100D;color:#F4EBDD}
.D .cta .ctas{justify-content:center}
.D footer{padding:36px 0;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
@media (max-width:860px){
  .A .feat{grid-template-columns:1fr;gap:24px}.A .feat:nth-child(even) .feat-img{order:0}
  .A .mini,.A .steps,.C .flow,.D .numsteps{grid-template-columns:1fr}
  .A .stage .cup{display:none}
  .C .flow{grid-template-columns:1fr 1fr}
  .C .cta{grid-template-columns:1fr}
  .C .hero-art{min-height:380px}
  .D .w2{grid-column:auto}
}
</style>
</head>
<body>

<div class="proto" role="toolbar" aria-label="Prototype controls">
  <b>Cafe'nMe landing</b>
  <button data-opt="A">A · อบอุ่นแบบคาเฟ่</button>
  <button data-opt="B">B · SaaS มินิมอล</button>
  <button data-opt="C">C · เน้นลูกค้าประจำ LINE</button>
  <button data-opt="D">D · Espresso Dark</button>
  <span class="sep"></span>

const OPTS = {
  A:{render:A,  desc:"ครีม + เทอร์ราคอตต้า, หัวข้อ serif — อบอุ่น ใกล้ภาพลักษณ์ร้านกาแฟ"},

  C:{render:Cc, desc:"เล่าเรื่องจากบัตรสะสมแต้ม LINE ก่อน — จุดขายที่ต่างจากคู่แข่ง"},
  D:{render:D,  desc:"โทนเข้ม Kanit ตัวใหญ่ — โดดเด่น ทันสมัย เหมาะกับโฆษณาโซเชียล"},
};
function show(k){
  if(!OPTS[k]) k="A";
  const page=document.getElementById("page");
  page.className=k; page.innerHTML=OPTS[k].render();
  document.querySelectorAll("[data-opt]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.opt===k));
  document.getElementById("optDesc").textContent=OPTS[k].desc;
  history.replaceState(null,"","#"+k);
  window.scrollTo(0,0);
}
document.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>show(b.dataset.opt));
document.getElementById("notesBtn").onclick=e=>{const on=document.body.classList.toggle("notes");e.target.setAttribute("aria-pressed",on)};
document.getElementById("ldBtn").onclick=()=>ldDialog.showModal();
document.addEventListener("click",e=>{const a=e.target.closest("#page a[href^='/']");if(a){e.preventDefault()}});
window.addEventListener("hashchange",()=>{const k=location.hash.slice(1);if(OPTS[k]&&k!==document.getElementById("page").className)show(k)});
show(location.hash.slice(1));
</script>
